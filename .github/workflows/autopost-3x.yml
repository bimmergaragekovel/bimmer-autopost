name: BimmerGarage Auto Post (3x Daily)

on:
  schedule:
    # 09:00 Київ = 06:00 UTC
    - cron: '0 6 * * *'
    # 13:00 Київ = 10:00 UTC
    - cron: '0 10 * * *'
    # 18:00 Київ = 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore post index state
        uses: actions/cache@v4
        with:
          path: state.json
          key: autopost-state-${{ github.run_number }}
          restore-keys: autopost-state-

      - name: Run autopost
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:    ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          FB_ACCESS_TOKEN:        ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_CREDENTIALS:     ${{ secrets.GOOGLE_CREDENTIALS }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
        run: python post.py

      - name: Save post index state
        uses: actions/cache@v4
        with:
          path: state.json
          key: autopost-state-${{ github.run_number }}
